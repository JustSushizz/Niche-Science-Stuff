<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Science Dictionary</title>
  <style>
    :root {
      --bg: #f4f9ff;
      --card: #ffffff;
      --primary: #1d4ed8;
      --primary-dark: #163bb8;
      --secondary: #0ea5e9;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #dbeafe;
      --shadow: 0 12px 30px rgba(37, 99, 235, 0.12);
      --light: #eef6ff;
      --good: #16a34a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #eef6ff 0%, #f8fbff 100%);
      color: var(--text);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border-radius: 22px;
      padding: 30px 26px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
    }

    .subtitle {
      margin-top: 10px;
      opacity: 0.95;
      font-size: 1.05rem;
    }

    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      background: #dfeafc;
      color: var(--primary-dark);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: var(--shadow);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 26px;
      align-items: center;
    }

    .search-box {
      flex: 1 1 360px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 16px 18px 16px 44px;
      border: 1px solid #dbe3f1;
      border-radius: 14px;
      background: white;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.08);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.2rem;
      color: var(--muted);
    }

    select {
      padding: 15px 16px;
      border-radius: 14px;
      border: 1px solid #dbe3f1;
      background: white;
      font-size: 1rem;
      color: var(--text);
      outline: none;
    }

    button.action-btn {
      padding: 15px 22px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    button.action-btn:hover {
      background: var(--primary-dark);
    }

    .word-card {
      background: var(--card);
      border: 1px solid #e5ecf8;
      box-shadow: var(--shadow);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 22px;
    }

    .word-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .word-name {
      font-size: clamp(2rem, 3vw, 2.5rem);
      font-weight: 700;
      margin: 0;
      color: var(--primary-dark);
    }

    .tag {
      display: inline-block;
      background: var(--accent);
      color: var(--primary-dark);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .definition {
      font-size: 1.08rem;
      line-height: 1.7;
      margin: 18px 0;
      color: var(--text);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .meta span {
      background: #f3f6fb;
      padding: 8px 12px;
      border-radius: 12px;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 1.05rem;
      background: var(--card);
      border-radius: 18px;
      border: 1px solid #e5ecf8;
    }

    .periodic-wrap {
      background: var(--card);
      border-radius: 22px;
      border: 1px solid #e5ecf8;
      box-shadow: var(--shadow);
      padding: 18px;
      overflow-x: auto;
    }

    .periodic-grid {
      display: grid;
      grid-template-columns: repeat(18, minmax(42px, 1fr));
      gap: 6px;
      min-width: 900px;
      margin-bottom: 20px;
    }

    .element-box {
      background: #f3f7ff;
      border: 1px solid #dfeafc;
      border-radius: 10px;
      min-height: 72px;
      padding: 6px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .element-box:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(29, 78, 216, 0.12);
    }

    .element-box.empty {
      background: transparent;
      border: none;
      pointer-events: none;
      min-height: 20px;
      box-shadow: none;
    }

    .element-number {
      font-size: 10px;
      opacity: 0.8;
    }

    .element-symbol {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .element-name {
      font-size: 9px;
      line-height: 1.1;
      margin-top: 2px;
    }

    .element-box.nonmetal { background: #dff7ed; }
    .element-box.noble-gas { background: #dfeeff; }
    .element-box.alkali-metal { background: #ffe9d6; }
    .element-box.alkaline-earth-metal { background: #ffe7f0; }
    .element-box.transition-metal { background: #e8ebff; }
    .element-box.metalloid { background: #e5f4d9; }
    .element-box.halogen { background: #fdf2d6; }
    .element-box.post-transition-metal { background: #f1e7ff; }
    .element-box.lanthanide { background: #f7ebff; }
    .element-box.actinide { background: #fbe9ee; }

    .element-panel {
      margin-top: 16px;
      background: #f8fbff;
      border: 1px solid #dfeafc;
      border-radius: 18px;
      padding: 18px 20px;
    }

    .element-panel h3 {
      margin: 0 0 8px;
      font-size: 1.7rem;
    }

    .element-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .element-meta span {
      background: white;
      border: 1px solid #dfeafc;
      border-radius: 10px;
      padding: 8px 12px;
    }

    .element-description {
      line-height: 1.7;
      margin-top: 14px;
      font-size: 1.04rem;
    }

    @media (max-width: 600px) {
      .controls {
        flex-direction: column;
        align-items: stretch;
      }
      .search-box, select, button.action-btn {
        width: 100%;
      }
    }
  </style>
</head>

    function renderDictionaryWords(items) {
      const results = document.getElementById("results");
      if (!items.length) {
        results.innerHTML = `
          <div class="empty">
            No words found. Try a different search or category.
          </div>
        `;
        return;
      }

      results.innerHTML = items.map(item => `
        <article class="word-card">
          <div class="word-header">
            <h2 class="word-name">${item.word}</h2>
            <span class="tag">${item.category}</span>
          </div>

          <div class="definition">${item.definition}</div>

          <div class="meta">

          </div>

      `).join("");

    function filterWords() {
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const selectedCategory = document.getElementById("categoryFilter").value;

      const filtered = scienceWords.filter(item => {
        const matchesCategory = selectedCategory === "all" || item.category === selectedCategory;
        const matchesSearch =
          item.word.toLowerCase().includes(query) ||
          item.definition.toLowerCase().includes(query) ||
          item.category.toLowerCase().includes(query);

        return matchesCategory && matchesSearch;
      });

      renderDictionaryWords(filtered);
    }

        cell.classList.add(el.category);
        cell.style.gridColumn = idx + 1;
        cell.innerHTML = `
          <div class="element-number">${el.number}</div>
          <div class="element-symbol">${el.symbol}</div>
          <div class="element-name">${el.name}</div>
        `;
        cell.addEventListener("click", () => updateElementPanel(el));
        actinideWrap.appendChild(cell);
      });
      grid.appendChild(actinideWrap);
    }

    function updateElementPanel(element) {
      const panel = document.getElementById("elementPanel");
      panel.innerHTML = `
        <h3>${element.name}</h3>
        <div class="element-meta">
          <span>Symbol: ${element.symbol}</span>
          <span>Atomic Number: ${element.number}</span>
          <span>Category: ${element.category.replace("-", " ")}</span>
          <span>Atomic Weight: ${element.weight}</span>
        </div>
        <div class="element-description">
          ${element.description}
        </div>
      `;
    }

    document.getElementById("searchInput").addEventListener("input", filterWords);
    document.getElementById("categoryFilter").addEventListener("change", filterWords);
    document.getElementById("randomBtn").addEventListener("click", () => {
      const randomWord = scienceWords[Math.floor(Math.random() * scienceWords.length)];
      document.getElementById("searchInput").value = randomWord.word;
      document.getElementById("categoryFilter").value = "all";
      renderDictionaryWords([randomWord]);
    });

    document.querySelectorAll(".tab-btn").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(panel => panel.classList.remove("active"));
        button.classList.add("active");
        document.getElementById(button.dataset.tab).classList.add("active");
      });
    });

    populateCategoryOptions();
    renderDictionaryWords(scienceWords);
    renderPeriodicTable();
  </script>
</body>
</html>
